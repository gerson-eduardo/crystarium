version: '3'
services:
  sqldb:
    image: postgres
    container_name: sql_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: crystarium_db
    ports:
      - 5432:5432
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 200M
    volumes:
      - ./data_volume:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: mail@estinien.web
      PGADMIN_DEFAULT_PASSWORD: drag00nPassword
    ports:
      - 5050:80
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 200M
  api-gateway:
    image: api-gateway
    container_name: api-gateway
    ports:
      - 8080:8081
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      args:
        SPRING_PROFILE: prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 200M
  eureka-server:
    image: eureka-server 
    container_name: eureka-server
    ports:
      - 8761:8761
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
      args:
        SPRING_PROFILE: prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 200M
 
  ms-users:
    image: ms-users
    container_name: ms-users
    build:
      context: ./ms-users
      dockerfile: Dockerfile
      args:
        SPRING_PROFILE: prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 200M
