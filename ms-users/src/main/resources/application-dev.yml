server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://crystarium_net:5432/crystarium_db
    username: admin
    password: admin
    driverClassName: org.postgresql.Drives
  jpa:
    hibernate:
      ddl-auto: create

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
